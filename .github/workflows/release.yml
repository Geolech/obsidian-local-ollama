name: Release

# Attaches main.js, manifest.json and styles.css as release assets whenever a
# non-prefixed semver tag (e.g. 2.8.2) is pushed, and generates GitHub build
# provenance attestations so the Obsidian community reviewer can verify the
# assets against this repository.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release files exist
        run: |
          for f in main.js manifest.json styles.css; do
            if [ ! -f "$f" ]; then
              echo "Missing required release file: $f" >&2
              exit 1
            fi
          done

      - name: Verify manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag $TAG does not match manifest.json version $MANIFEST_VERSION" >&2
            exit 1
          fi

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
